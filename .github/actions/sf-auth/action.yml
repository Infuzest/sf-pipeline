name: "Salesforce toolbox check + org auth"
description: >
  Verifies the pinned Salesforce CLI, sfdx-git-delta, and code-analyzer versions
  supplied by the OrbitOps toolbox image, then authenticates to an org. Two auth methods:
  "jwt" (connected app + certificate — used for PROD) and
  "sfdx-url" (SFDX auth URL — used for scratch-org stages, whose orgs cannot
  create connected apps since Spring '26). Used by every Salesforce DevOps workflow
  that touches an org.

inputs:
  auth-method:
    description: '"jwt", "sfdx-url", or "none" (verify tools only, no org auth)'
    required: false
    default: "jwt"
  # jwt method
  client-id:
    description: "Connected app consumer key (normally the shared ORBITOPS_JWT_CLIENT_ID secret)"
    required: false
  username:
    description: "Integration user username resolved from connected-orgs.json"
    required: false
  jwt-key:
    description: "Private key PEM contents (normally the shared ORBITOPS_JWT_KEY secret)"
    required: false
  instance-url:
    description: "Login URL resolved from the connected org type: https://login.salesforce.com or https://test.salesforce.com"
    required: false
  # sfdx-url method
  auth-url:
    description: "SFDX auth URL, from `sf org display --verbose` (secret SF_AUTH_URL)"
    required: false
  alias:
    description: "CLI alias to assign to the authenticated org"
    required: false
    default: "target-org"
  cli-version:
    description: "Pinned @salesforce/cli version"
    required: false
    default: "2.142.7"
  sgd-version:
    description: "Pinned sfdx-git-delta plugin version"
    required: false
    default: "6.45.1"
  code-analyzer-version:
    description: "Pinned @salesforce/plugin-code-analyzer version"
    required: false
    default: "5.14.0"

runs:
  using: "composite"
  steps:
    - name: Verify preinstalled Salesforce tools
      shell: bash
      run: |
        set -euo pipefail
        # actions/checkout records safe.directory under a temporary HOME. Job
        # containers restore /github/home for later shells, so persist trust in
        # the mounted workspace before any Git-based Salesforce tooling runs.
        if [ -n "${GITHUB_WORKSPACE:-}" ]; then
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
        fi
        command -v sf >/dev/null || {
          echo "Salesforce CLI is missing. Run this job with the OrbitOps Salesforce toolbox image." >&2
          exit 1
        }

        ACTUAL_CLI=$(sf version --json 2>/dev/null \
          | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).cliVersion')
        [ "$ACTUAL_CLI" = "@salesforce/cli/${{ inputs.cli-version }}" ] || {
          echo "Expected @salesforce/cli/${{ inputs.cli-version }}, found $ACTUAL_CLI" >&2
          exit 1
        }

        PLUGIN_VERSIONS=$(sf plugins --json 2>/dev/null | node -e '
          const plugins = JSON.parse(require("fs").readFileSync(0, "utf8"));
          for (const name of ["sfdx-git-delta", "@salesforce/plugin-code-analyzer"]) {
            const plugin = plugins.find((candidate) => candidate.name === name);
            console.log(`${name}=${plugin?.version ?? "missing"}`);
          }
        ')
        grep -Fxq 'sfdx-git-delta=${{ inputs.sgd-version }}' <<< "$PLUGIN_VERSIONS" || {
          echo "Expected sfdx-git-delta ${{ inputs.sgd-version }} in the toolbox image" >&2
          echo "$PLUGIN_VERSIONS" >&2
          exit 1
        }
        grep -Fxq '@salesforce/plugin-code-analyzer=${{ inputs.code-analyzer-version }}' <<< "$PLUGIN_VERSIONS" || {
          echo "Expected code-analyzer ${{ inputs.code-analyzer-version }} in the toolbox image" >&2
          echo "$PLUGIN_VERSIONS" >&2
          exit 1
        }
        printf 'Using %s, sfdx-git-delta %s, code-analyzer %s\n' \
          "$ACTUAL_CLI" "${{ inputs.sgd-version }}" "${{ inputs.code-analyzer-version }}"

    - name: Authenticate
      shell: bash
      env:
        SF_AUTH_METHOD: ${{ inputs.auth-method }}
        SF_AUTH_CLIENT_ID: ${{ inputs.client-id }}
        SF_AUTH_USERNAME: ${{ inputs.username }}
        SF_AUTH_JWT_KEY: ${{ inputs.jwt-key }}
        SF_AUTH_INSTANCE_URL: ${{ inputs.instance-url }}
        SF_AUTH_URL_VALUE: ${{ inputs.auth-url }}
      run: |
        set -euo pipefail
        TMPFILE="$(mktemp)"
        trap 'rm -f "$TMPFILE"' EXIT
        case "$SF_AUTH_METHOD" in
          jwt)
            MISSING=()
            [ -n "$SF_AUTH_CLIENT_ID" ] || MISSING+=("connected-app client ID")
            [ -n "$SF_AUTH_USERNAME" ] || MISSING+=("integration username")
            [ -n "$SF_AUTH_JWT_KEY" ] || MISSING+=("JWT private key")
            [ -n "$SF_AUTH_INSTANCE_URL" ] || MISSING+=("Salesforce login service")
            if [ "${#MISSING[@]}" -gt 0 ]; then
              printf -v MISSING_LIST '%s, ' "${MISSING[@]}"
              MISSING_LIST="${MISSING_LIST%, }"
              echo "::error title=Salesforce connection is incomplete::Missing ${MISSING_LIST}. Reconnect this environment in OrbitOps Administration, or restore its legacy GitHub secrets."
              exit 1
            fi
            printf '%s' "$SF_AUTH_JWT_KEY" > "$TMPFILE"
            sf org login jwt \
              --client-id "$SF_AUTH_CLIENT_ID" \
              --username "$SF_AUTH_USERNAME" \
              --jwt-key-file "$TMPFILE" \
              --instance-url "$SF_AUTH_INSTANCE_URL" \
              --alias "${{ inputs.alias }}" \
              --set-default
            ;;
          sfdx-url)
            if [ -z "$SF_AUTH_URL_VALUE" ]; then
              echo "::error title=Salesforce connection is incomplete::The legacy Salesforce authorization URL is missing. Reconnect this environment in OrbitOps Administration."
              exit 1
            fi
            printf '%s' "$SF_AUTH_URL_VALUE" > "$TMPFILE"
            sf org login sfdx-url \
              --sfdx-url-file "$TMPFILE" \
              --alias "${{ inputs.alias }}" \
              --set-default
            ;;
          none)
            echo "Salesforce tools verified; skipping org auth (auth-method: none)"
            ;;
          *)
            echo "Unknown auth-method: $SF_AUTH_METHOD" >&2; exit 1
            ;;
        esac
