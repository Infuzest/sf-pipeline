name: OrbitOps Salesforce toolbox image

on:
  pull_request:
    paths:
      - .github/images/sf-toolbox/**
      - .github/workflows/sf-toolbox-image.yml
  push:
    branches: [main]
    paths:
      - .github/images/sf-toolbox/**
      - .github/workflows/sf-toolbox-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/xyraxel/orbitops-sf-toolbox
  VERSION_TAG: 2.142.7-sgd6.45.1-ca5.14.0

jobs:
  build:
    name: Build and verify toolbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/images/sf-toolbox
          file: .github/images/sf-toolbox/Dockerfile
          platforms: linux/amd64
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify preinstalled tools
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION_TAG}" bash -lc '
            set -euo pipefail
            test "$(sf version --json | node -pe '\''JSON.parse(require("fs").readFileSync(0,"utf8")).cliVersion'\'')" = "@salesforce/cli/2.142.7"
            sf sgd --help >/dev/null
            sf code-analyzer --help >/dev/null
            git --version
            gh --version | head -1
            java -version
            python3 --version
          '
