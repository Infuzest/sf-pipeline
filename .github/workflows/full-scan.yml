# Weekly full-repo static analysis (REQUIREMENTS.md E7.4) — refreshes code
# scanning results and the "Scanner burn-down" tracking issue.
name: Salesforce DevOps Full Scan

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  packages: read
  security-events: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  full-scan:
    name: Full scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/infuzest/orbitops-sf-toolbox:2.142.7-sgd6.45.1-ca5.14.0-r2
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
      - run: npm ci
      - name: Resolve external reporting policy
        id: reporting
        run: node scripts/context/resolve-reporting.mjs
      - uses: ./.github/actions/sf-auth
        with: { auth-method: none }
      - name: Scan full workspace
        id: scan
        run: |
          sf code-analyzer run --workspace force-app --config-file code-analyzer.yml --output-file results.sarif
          HAS_RUNS=$(node -pe 'JSON.parse(require("fs").readFileSync("results.sarif","utf8")).runs?.length > 0' 2>/dev/null || echo false)
          echo "has_runs=$HAS_RUNS" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF to code scanning
        if: steps.scan.outputs.has_runs == 'true' && steps.reporting.outputs.publish_sarif == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4 (Node 24)
        with:
          sarif_file: results.sarif
          category: orbitops-full
      - name: Update burn-down issue
        run: node scripts/scanner/burndown.mjs results.sarif --issue
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: full-scan-sarif
          path: results.sarif
