# Salesforce DevOps PR validation — REUSABLE workflow (single source of truth).
#
# All validation logic lives HERE, on main. Every stage branch carries only a
# thin caller (pr-validate.yml) that does `uses: ...@main`, so a fix merged to
# main applies to every promotion immediately — no per-branch syncing.
#
# The caller workspace is the code under validation. The private runtime action
# exposes pipeline implementation as ORBITOPS_RUNTIME; customer repositories do
# not carry scripts, actions, schemas, or scanner implementation.
name: Salesforce DevOps validation

on:
  workflow_call: {}

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  context:
    name: Resolve stage
    runs-on: ubuntu-latest
    outputs:
      is_stage: ${{ steps.stage.outputs.is_stage }}
      org: ${{ steps.stage.outputs.org }}
      environment: ${{ steps.stage.outputs.environment }}
      auth_method: ${{ steps.stage.outputs.auth_method }}
      # Set only for UI-connected orgs. The username varies by org; the CI/CD
      # client id and private key are shared repository secrets.
      username: ${{ steps.stage.outputs.username }}
      instance_url: ${{ steps.stage.outputs.instance_url }}
      test_level: ${{ steps.test-plan.outputs.test_level }}
      test_classes: ${{ steps.test-plan.outputs.test_classes }}
      skip_validation: ${{ steps.test-plan.outputs.skip_validation }}
      min_coverage: ${{ steps.stage.outputs.min_coverage }}
      scanner_max_severity: ${{ steps.stage.outputs.scanner_max_severity }}
      work_items_required: ${{ steps.stage.outputs.work_items_required }}
      publish_sarif: ${{ steps.stage.outputs.publish_sarif }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - id: stage
        run: |
          git fetch -q origin orbitops-meta 2>/dev/null || true
          git show origin/orbitops-meta:connected-orgs.json > connected-orgs.json 2>/dev/null || echo "[]" > connected-orgs.json
          node "$ORBITOPS_RUNTIME/scripts/context/resolve-stage.mjs" "${{ github.base_ref }}" --optional --registry connected-orgs.json
      - id: test-plan
        if: steps.stage.outputs.is_stage == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          node "$ORBITOPS_RUNTIME/scripts/context/request-test-plan.mjs" --body pr-body.md \
            --fallback-level '${{ steps.stage.outputs.test_level }}' \
            --fallback-classes '${{ steps.stage.outputs.test_classes }}' \
            --allow-request '${{ steps.stage.outputs.policy_owner == 'developer' || (startsWith(github.head_ref, 'orbitops/bundle/') && github.event.pull_request.user.type == 'Bot') }}'
  delta:
    name: What will deploy
    needs: context
    if: needs.context.outputs.is_stage == 'true' && needs.context.outputs.skip_validation != 'true'
    runs-on: ${{ fromJSON(vars.ORBITOPS_TOOLBOX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/infuzest/orbitops-sf-toolbox:2.142.7-sgd6.45.1-ca5.14.0-r2
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    outputs:
      empty: ${{ steps.render.outputs.empty }}
      has_apex: ${{ steps.render.outputs.has_apex }}
      has_coverage_apex: ${{ steps.coverage-apex.outputs.has_coverage_apex }}
      destructive_count: ${{ steps.render.outputs.destructive_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - uses: Infuzest/sf-pipeline/.github/actions/sf-auth@main
        with: { auth-method: none }
      - name: Compute delta package
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p deploy-package
          # Scope the delta to the declared package dirs — sgd otherwise scans
          # the whole repo and sweeps in metadata-shaped files that live outside
          # a package (e.g. scripts/setup/**), producing components with no
          # source behind them.
          SRC=$(node $ORBITOPS_RUNTIME/scripts/context/package-dirs.mjs)
          # shellcheck disable=SC2086
          sf sgd source delta --from "origin/${{ github.base_ref }}" --to "HEAD" $SRC --output-dir deploy-package
      - name: Render deploy preview
        id: render
        working-directory: ${{ github.workspace }}
        run: node $ORBITOPS_RUNTIME/scripts/delta/render-comment.mjs deploy-package --out deploy-package/comment.md
      - name: Detect production Apex for coverage
        id: coverage-apex
        working-directory: ${{ github.workspace }}
        run: node $ORBITOPS_RUNTIME/scripts/delta/coverage-apex.mjs deploy-package
      - name: Post sticky comment
        working-directory: ${{ github.workspace }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node $ORBITOPS_RUNTIME/scripts/comments/sticky.mjs "<!-- orbitops:deploy-preview -->" deploy-package/comment.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: deploy-package
          path: deploy-package/

  work-items:
    name: Work items
    needs: context
    if: needs.context.outputs.is_stage == 'true' && needs.context.outputs.skip_validation != 'true' && needs.context.outputs.work_items_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - name: Collect PR commit messages
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/commits" \
            --paginate --jq '[.[].commit.message]' > commits.json
      - name: Check work-item tagging
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: node $ORBITOPS_RUNTIME/scripts/workitems/check.mjs --title "$PR_TITLE" --branch "$HEAD_REF" --commits-file commits.json

  scan:
    name: Code scan
    needs: context
    if: needs.context.outputs.is_stage == 'true' && needs.context.outputs.skip_validation != 'true'
    runs-on: ${{ fromJSON(vars.ORBITOPS_TOOLBOX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/infuzest/orbitops-sf-toolbox:2.142.7-sgd6.45.1-ca5.14.0-r2
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - uses: Infuzest/sf-pipeline/.github/actions/sf-auth@main
        with: { auth-method: none }
      - name: Collect changed files
        id: files
        working-directory: ${{ github.workspace }}
        run: |
          git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- force-app > changed.txt
          COUNT=$(grep -c . changed.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Changed files ($COUNT):"; cat changed.txt
      - name: Scan changed files
        id: scan
        if: steps.files.outputs.count != '0'
        working-directory: ${{ github.workspace }}
        run: |
          WORKSPACE_ARGS=()
          while IFS= read -r f; do [ -n "$f" ] && WORKSPACE_ARGS+=(--workspace "$f"); done < changed.txt
          sf code-analyzer run "${WORKSPACE_ARGS[@]}" --config-file $ORBITOPS_RUNTIME/code-analyzer.yml --output-file results.sarif
          # code scanning rejects a SARIF with zero runs (nothing scannable changed)
          HAS_RUNS=$(node -pe 'JSON.parse(require("fs").readFileSync("results.sarif","utf8")).runs?.length > 0' 2>/dev/null || echo false)
          echo "has_runs=$HAS_RUNS" >> "$GITHUB_OUTPUT"
      - name: Severity gate
        id: gate
        working-directory: ${{ github.workspace }}
        run: |
          GATE_FAILED=0
          # Only findings accepted on the target branch are grandfathered.
          # A feature branch cannot silence its own new findings by editing the baseline.
          git show "origin/${{ github.base_ref }}:.orbitops/scanner-baseline.json" \
            > accepted-scan-baseline.json 2>/dev/null || printf '[]\n' > accepted-scan-baseline.json
          node $ORBITOPS_RUNTIME/scripts/scanner/gate.mjs results.sarif "${{ needs.context.outputs.scanner_max_severity }}" \
            --baseline accepted-scan-baseline.json \
            --out scan-summary.md --comment-out scan-comment.md || GATE_FAILED=1
          cat scan-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$GATE_FAILED" >> "$GITHUB_OUTPUT"
      - name: Post scan comment
        working-directory: ${{ github.workspace }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node $ORBITOPS_RUNTIME/scripts/comments/sticky.mjs "<!-- orbitops:scan -->" scan-comment.md
      - name: Publish SARIF to GitHub code scanning
        if: steps.scan.outputs.has_runs == 'true' && needs.context.outputs.publish_sarif == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4 (Node 24)
        with:
          sarif_file: results.sarif
          category: orbitops-scanner
      - name: Enforce gate
        if: steps.gate.outputs.failed == '1'
        working-directory: ${{ github.workspace }}
        run: |
          cat scan-summary.md
          echo "Review the inline annotations or the OrbitOps code-scan comment on this pull request."
          exit 1

  validate:
    name: Validate against target org
    needs: [context, delta]
    # The remaining quality checks still run when a release manager skips
    # Salesforce validation, but this job is recorded as skipped and never
    # reads credentials or contacts the target org.
    if: needs.context.outputs.is_stage == 'true' && needs.delta.outputs.empty != 'true' && needs.context.outputs.skip_validation != 'true'
    runs-on: ${{ fromJSON(vars.ORBITOPS_TOOLBOX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/infuzest/orbitops-sf-toolbox:2.142.7-sgd6.45.1-ca5.14.0-r2
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    outputs:
      succeeded: ${{ steps.parse.outputs.succeeded }}
      validation_id: ${{ steps.parse.outputs.validation_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - name: Prepare validation status fallback
        run: |
          printf '%s\n' \
            '<!-- orbitops:validate-errors -->' \
            '## ❌ Salesforce validation could not start' \
            '' \
            'Authentication or job setup failed before the validation ran. Open the workflow log for the exact cause, then retry the checks.' \
            > errors-comment.md
      - uses: Infuzest/sf-pipeline/.github/actions/sf-auth@main
        with:
          auth-method: ${{ needs.context.outputs.auth_method }}
          client-id: ${{ needs.context.outputs.username != '' && secrets.ORBITOPS_JWT_CLIENT_ID || secrets[format('{0}_SF_CLIENT_ID', needs.context.outputs.org)] }}
          username: ${{ needs.context.outputs.username != '' && needs.context.outputs.username || secrets[format('{0}_SF_USERNAME', needs.context.outputs.org)] }}
          jwt-key: ${{ needs.context.outputs.username != '' && secrets.ORBITOPS_JWT_KEY || secrets[format('{0}_SF_JWT_KEY', needs.context.outputs.org)] }}
          instance-url: ${{ needs.context.outputs.instance_url != '' && needs.context.outputs.instance_url || secrets[format('{0}_SF_INSTANCE_URL', needs.context.outputs.org)] }}
          auth-url: ${{ secrets[format('{0}_SF_AUTH_URL', needs.context.outputs.org)] }}
          alias: target-org
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6 (Node 24)
        with:
          name: deploy-package
          path: deploy-package/
      - name: Check-only deploy
        working-directory: ${{ github.workspace }}
        env:
          ORBITOPS_TEST_CLASSES: ${{ needs.context.outputs.test_classes }}
        run: |
          TEST_LEVEL="${{ needs.context.outputs.test_level }}"
          if [ "$TEST_LEVEL" = "Conditional" ]; then
            if [ "${{ needs.delta.outputs.has_apex }}" = "true" ]; then TEST_LEVEL=RunLocalTests; else TEST_LEVEL=NoTestRun; fi
          fi
          DESTRUCTIVE_ARGS=()
          if [ "${{ needs.delta.outputs.destructive_count }}" != "0" ]; then
            DESTRUCTIVE_ARGS=(--post-destructive-changes deploy-package/destructiveChanges/destructiveChanges.xml)
          fi
          TEST_ARGS=()
          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
            while IFS= read -r test_class; do
              [ -n "$test_class" ] && TEST_ARGS+=(--tests "$test_class")
            done < <(node $ORBITOPS_RUNTIME/scripts/context/test-classes.mjs)
          fi
          # `sf project deploy validate` rejects NoTestRun (validations exist to
          # enable quick-deploys, which require tests). Use a dry-run for that case;
          # it has identical check-only semantics but yields no quick-deploy ID.
          if [ "$TEST_LEVEL" = "NoTestRun" ]; then
            echo "VALIDATE_MODE=dry-run" >> "$GITHUB_ENV"
            echo "Dry-run check-only deploy (no tests)"
            sf project deploy start --dry-run --ignore-conflicts \
              --manifest deploy-package/package/package.xml \
              "${DESTRUCTIVE_ARGS[@]}" \
              --test-level NoTestRun \
              "${TEST_ARGS[@]}" \
              --target-org target-org \
              --wait 60 --json > validate-result.json || true
          else
            echo "VALIDATE_MODE=validate" >> "$GITHUB_ENV"
            echo "Validating with test level: $TEST_LEVEL"
            sf project deploy validate \
              --manifest deploy-package/package/package.xml \
              "${DESTRUCTIVE_ARGS[@]}" \
              --test-level "$TEST_LEVEL" \
              "${TEST_ARGS[@]}" \
              --target-org target-org \
              --wait 60 --json > validate-result.json || true
          fi
      - name: Parse result
        id: parse
        working-directory: ${{ github.workspace }}
        env:
          ORBITOPS_VALIDATION_TEST_LEVEL: ${{ needs.context.outputs.test_level }}
          ORBITOPS_VALIDATION_TEST_CLASSES: ${{ needs.context.outputs.test_classes }}
        run: |
          QUICKDEPLOY_ARGS=()
          if [ "$VALIDATE_MODE" = "validate" ]; then QUICKDEPLOY_ARGS=(--quickdeploy quickdeploy.json); fi
          VALIDATE_FAILED=0
          node $ORBITOPS_RUNTIME/scripts/deploy/parse-validate-result.mjs validate-result.json \
            "${QUICKDEPLOY_ARGS[@]}" --coverage coverage.json --errors errors.md || VALIDATE_FAILED=1
          if [ -f errors.md ]; then
            { echo "<!-- orbitops:validate-errors -->"; cat errors.md; } > errors-comment.md
          else
            printf '<!-- orbitops:validate-errors -->\n## ✅ Validation succeeded against %s\n' "${{ needs.context.outputs.org }}" > errors-comment.md
          fi
          exit "$VALIDATE_FAILED"
      - name: Post validation status comment
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node $ORBITOPS_RUNTIME/scripts/comments/sticky.mjs "<!-- orbitops:validate-errors -->" errors-comment.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        if: always()
        with:
          name: validation-output
          path: |
            quickdeploy.json
            coverage.json
          if-no-files-found: ignore

  coverage:
    name: Coverage gate
    needs: [context, delta, validate]
    if: needs.context.outputs.is_stage == 'true' && needs.delta.outputs.empty != 'true' && needs.context.outputs.skip_validation != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6 (Node 24)
        with:
          name: validation-output
      - name: Enforce minimum coverage
        run: |
          if [ ! -f coverage.json ]; then
            echo '{"overall": null, "perClass": []}' > coverage.json
          fi
          node $ORBITOPS_RUNTIME/scripts/deploy/check-coverage.mjs coverage.json "${{ needs.context.outputs.min_coverage }}" \
            --has-apex "${{ needs.delta.outputs.has_coverage_apex }}" --summary gate.md
          cat gate.md >> "$GITHUB_STEP_SUMMARY"
