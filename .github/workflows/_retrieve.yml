# Salesforce DevOps citizen workspace — "Pull my changes" (REQUIREMENTS.md E6.2).
# Retrieves a builder's sandbox edits (via source tracking) into their
# work-item branch as a bot commit. Dispatched by the UI.
name: Salesforce DevOps retrieve logic

on:
  workflow_call:
    inputs:
      operation:
        description: "tracked, recent, catalog, or selected"
        required: true
        default: tracked
        type: string
      modified_days:
        description: "For recent pulls, include metadata modified within this many days"
        required: false
        default: "2"
        type: string
      work_branch:
        description: "Work-item branch to commit retrieved changes to (feature/…)"
        required: false
        default: ""
        type: string
      source_org:
        description: "Org key the builder worked in (a devOrgs entry or stage org from .orbitops/pipeline.yml)"
        required: true
        default: INT
        type: string
      selection:
        description: "Explicit Type:Member entries, one per line (selected operation only)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: retrieve-${{ inputs.work_branch }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  context:
    name: Resolve org
    runs-on: ubuntu-latest
    outputs:
      org: ${{ steps.org.outputs.org }}
      auth_method: ${{ steps.org.outputs.auth_method }}
      # Set only for UI-connected orgs (JWT with the shared certificate);
      # empty for stage/dev orgs, which keep their per-org secrets.
      username: ${{ steps.org.outputs.username }}
      instance_url: ${{ steps.org.outputs.instance_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      - id: org
        run: |
          git fetch -q origin orbitops-meta 2>/dev/null || true
          git show origin/orbitops-meta:connected-orgs.json > connected-orgs.json 2>/dev/null || echo "[]" > connected-orgs.json
          node "$ORBITOPS_RUNTIME/scripts/context/resolve-org.mjs" "${{ inputs.source_org }}" --registry connected-orgs.json

  retrieve:
    name: Pull changes from ${{ inputs.source_org }}
    needs: context
    runs-on: ${{ fromJSON(vars.ORBITOPS_TOOLBOX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/infuzest/orbitops-sf-toolbox:2.142.7-sgd6.45.1-ca5.14.0-r2
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      # Workflow ref (main) checkout — scripts stay current (Phase 6 lesson);
      # the work branch is materialized as a worktree for the retrieve itself.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with: { fetch-depth: 0 }
      - uses: Infuzest/sf-pipeline/.github/actions/runtime@main
      # Connected orgs (context.username set) authenticate via JWT with the
      # shared OrbitOps CI certificate — no per-org tokens exist, so Salesforce's
      # forced refresh-token rotation can't break them. Stage/dev orgs keep
      # their per-org secrets.
      - uses: Infuzest/sf-pipeline/.github/actions/sf-auth@main
        with:
          auth-method: ${{ needs.context.outputs.auth_method }}
          client-id: ${{ needs.context.outputs.username != '' && secrets.ORBITOPS_JWT_CLIENT_ID || secrets[format('{0}_SF_CLIENT_ID', needs.context.outputs.org)] }}
          username: ${{ needs.context.outputs.username != '' && needs.context.outputs.username || secrets[format('{0}_SF_USERNAME', needs.context.outputs.org)] }}
          jwt-key: ${{ needs.context.outputs.username != '' && secrets.ORBITOPS_JWT_KEY || secrets[format('{0}_SF_JWT_KEY', needs.context.outputs.org)] }}
          instance-url: ${{ needs.context.outputs.instance_url != '' && needs.context.outputs.instance_url || secrets[format('{0}_SF_INSTANCE_URL', needs.context.outputs.org)] }}
          auth-url: ${{ secrets[format('{0}_SF_AUTH_URL', needs.context.outputs.org)] }}
          alias: source-org

      - name: Prepare metadata request
        id: manifest
        env:
          ORBITOPS_SELECTION: ${{ inputs.selection }}
        run: |
          if [ "${{ inputs.operation }}" = "catalog" ]; then
            node "$ORBITOPS_RUNTIME/scripts/retrieve/metadata-catalog.mjs" --org source-org --out metadata-catalog.json
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.operation }}" = "selected" ]; then
            node "$ORBITOPS_RUNTIME/scripts/retrieve/metadata-selection.mjs" --out retrieve-package.xml --json tracked.json
          elif [ "${{ inputs.operation }}" = "recent" ]; then
            node "$ORBITOPS_RUNTIME/scripts/retrieve/metadata-catalog.mjs" --org source-org --out metadata-catalog.json
            node "$ORBITOPS_RUNTIME/scripts/retrieve/recent-metadata.mjs" --catalog metadata-catalog.json \
              --days "${{ inputs.modified_days }}" --out retrieve-package.xml --json tracked.json
          else
            node "$ORBITOPS_RUNTIME/scripts/retrieve/source-members.mjs" --org source-org \
              --out retrieve-package.xml --json tracked.json
          fi
          COUNT=$(node -pe 'JSON.parse(require("fs").readFileSync("tracked.json","utf8")).total')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Publish sandbox catalogue
        if: inputs.operation == 'catalog'
        run: |
          set -euo pipefail
          git config user.name "orbitops-bot"
          git config user.email "orbitops-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin orbitops-meta 2>/dev/null || true
            if git show-ref -q refs/remotes/origin/orbitops-meta; then
              git worktree add -q .meta origin/orbitops-meta
            else
              git worktree add -q --detach .meta
              git -C .meta checkout -q --orphan orbitops-meta
              git -C .meta rm -rfq . 2>/dev/null || true
            fi
            mkdir -p .meta/metadata-catalogs
            cp metadata-catalog.json ".meta/metadata-catalogs/${GITHUB_RUN_ID}.json"
            git -C .meta add -A
            git -C .meta commit -q -m "Record metadata catalogue ${GITHUB_RUN_ID}"
            if git -C .meta push -q origin HEAD:orbitops-meta; then
              git worktree remove -f .meta
              break
            fi
            git worktree remove -f .meta
            echo "catalogue push race (attempt $attempt), retrying"
          done

      - name: Retrieve into the work branch
        if: inputs.operation != 'catalog' && steps.manifest.outputs.count != '0'
        run: |
          set -euo pipefail
          WB="${{ inputs.work_branch }}"
          git fetch -q origin "$WB"
          git worktree add -q wb "origin/$WB"
          cp retrieve-package.xml wb/
          (cd wb && sf project retrieve start --manifest retrieve-package.xml \
             --target-org source-org --ignore-conflicts --wait 30 --json > retrieve-result.json) || true
          node -e "
            const r=JSON.parse(require('fs').readFileSync('wb/retrieve-result.json','utf8'));
            if(r.status!==0){console.error('Retrieve failed:', r.message ?? r.result?.messages); process.exit(1)}
            console.log('Retrieved', (r.result.files??[]).length, 'file(s)');"
          rm -f wb/retrieve-package.xml wb/retrieve-result.json
          cd wb
          git config user.name "orbitops-bot"
          git config user.email "orbitops-bot@users.noreply.github.com"
          git add -A force-app
          if git diff --cached --quiet; then
            echo "No differences vs the work branch — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            WORK_ITEM=$(echo "$WB" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+|AB#[0-9]+' | head -1 || true)
            git commit -q \
              -m "Pull changes from the ${{ inputs.source_org }} org" \
              -m "Retrieved via Salesforce DevOps for $WB." \
              -m "Work-Items: ${WORK_ITEM:-POC-0}"
            git push -q origin "HEAD:$WB"
            {
              echo "### 📥 Pulled changes from ${{ inputs.source_org }}"
              echo ""
              git show --stat --format="" HEAD | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nothing tracked
        if: inputs.operation == 'tracked' && steps.manifest.outputs.count == '0'
        run: echo "No tracked changes found in the ${{ inputs.source_org }} org." >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing changed recently
        if: inputs.operation == 'recent' && steps.manifest.outputs.count == '0'
        run: echo "No supported metadata changed in the last ${{ inputs.modified_days }} day(s)." >> "$GITHUB_STEP_SUMMARY"
