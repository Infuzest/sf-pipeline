# Salesforce DevOps deploy — THIN CALLER. Do not add logic here.
#
# All deploy logic lives in _deploy.yml on MAIN (referenced with @main below,
# deliberately a moving ref — that's the point): fixes merged to main apply to
# every stage branch immediately. This stub is installed once on each stage
# branch and never needs to change again.
name: Salesforce DevOps Deploy

on:
  # Normal releases run through release-candidate.yml: Salesforce deploys the
  # PR candidate before it is merged, so a stage branch only records releases
  # that are already live. This workflow remains the explicit repair path for
  # a drifted org.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual deploy is needed (audit log)"
        required: true
      mode:
        description: "Full re-deploy repairs an org that has drifted from the branch"
        required: false
        default: delta
        type: choice
        options: [delta, full]
      include:
        description: "Extra components to add to the delta — Type:Member, comma separated (e.g. CustomObject:Bank_Transactions__c)"
        required: false
        default: ""

permissions:
  contents: write # deploy tags + orbitops-meta branch
  deployments: write
  packages: read # pull the private OrbitOps Salesforce toolbox image
  pull-requests: write # back-promotion PRs

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false # queue, never cancel a deploy

jobs:
  pipeline:
    uses: Infuzest/sf-pipeline/.github/workflows/_deploy.yml@main
    with:
      reason: ${{ inputs.reason || '' }}
      mode: ${{ inputs.mode || 'delta' }}
      include: ${{ inputs.include || '' }}
    secrets: inherit
