# Salesforce DevOps pipeline definition — the single source of truth for stages and gates.
# Edited via PR only (see CODEOWNERS). Validated by scripts/validate-pipeline-config.mjs.
# Stage order in this file IS the promotion order (left to right on the board).

devOrgs:
  - name: Shared dev org (also INT)
    org: INT
    authMethod: sfdx-url

# Jira/Azure DevOps traceability is optional for the POC. Turn this on only
# after a tracker has been configured for the project.
workItems:
  required: false

# Findings are still enforced by the OrbitOps scanner gate. Publishing the
# SARIF report into GitHub code scanning is optional because it requires the
# repository to have that GitHub feature available.
codeScanning:
  publishSarif: false

pipeline:
  - branch: integration
    org: DEV_DEV2
    environment: integration
    authMethod: jwt
    testLevel: Conditional
    policy:
      owner: developer
    quickDeploy: false
    gates:
      scannerMaxSeverity: 2
      minCoverage: 75
  - branch: main
    org: DEV_INTEGRATION
    environment: production
    authMethod: jwt
    testLevel: RunLocalTests
    policy:
      owner: central
    quickDeploy: false
    gates:
      scannerMaxSeverity: 2
      minCoverage: 80
      requiredReviewers: true
